name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      MEMORY_DB_PATH: ${{ github.workspace }}/.ci-tmp/memory.db
      LLMLINGUA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Uses the same installer end users run (creates .venv, installs deps)
      - name: Setup (scripts/manage.py setup --dev)
        run: python scripts/manage.py setup --dev

      - name: Lint (ruff)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -m ruff check backend tests scripts

      - name: Tests
        run: python scripts/manage.py test

      - name: Smoke test - start server and hit /health
        run: |
          # Same command start.bat / start.sh run
          python scripts/manage.py start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "Server did not come up:"; cat server.log; exit 1

  install-scripts:
    name: Install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup.sh (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x setup.sh && test -x start.sh || { echo "setup.sh/start.sh must be executable"; exit 1; }
          ./setup.sh
          python scripts/manage.py doctor

      - name: setup.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.bat
          if errorlevel 1 exit /b 1
          python scripts\manage.py doctor

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Validate manifest, icons and JS syntax
        run: npm run check
      - name: Build
        run: npm run build:prod
      - name: Validate built bundle
        run: node scripts/check-extension.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: contextlayer-extension
          path: extension/dist
